name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: pnpm backend:setup
      - run: pnpm setup:apps
      - run: pnpm contracts:generate
      - run: git diff --exit-code -- contracts/openapi.json web/src/lib/api/schema.d.ts mobile/src/data/api/schema.d.ts
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm web:check
      - run: pnpm --dir web test:api-errors
      - run: pnpm --dir web test:auth
      - run: pnpm --dir web test:account
      - run: pnpm --dir web test:unit
      # The web's copy of the form engine must match the mobile original byte for byte.
      - run: pnpm forms:parity
      # Token drift and contrast. The email-template half of `pnpm tokens:check` runs in the
      # backend job (tests/test_email.py).
      - run: node scripts/contour-tokens.mjs --check
      - run: pnpm build
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm --dir mobile install --frozen-lockfile
      - run: pnpm mobile:check
      - run: pnpm mobile:test
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - run: pnpm db:start
      - run: pnpm db:test
      - if: always()
        run: pnpm db:stop
  backend:
    runs-on: ubuntu-latest
    env:
      # Same pinned version; avoid ECR's unauthenticated data-limit failures.
      DECAMARK_REHEARSAL_IMAGE: supabase/postgres:17.6.1.171
    steps:
      - uses: actions/checkout@v4
        with:
          # Forward rehearsal reads the authentic pre-recovery migration blobs.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: '3.13'
      - name: Install collector dependencies for real queue acceptance
        run: pnpm --dir mobile install --frozen-lockfile
      - run: pnpm backend:setup
      - run: pnpm backend:check
      - name: Cache pinned disposable database image
        run: docker pull "$DECAMARK_REHEARSAL_IMAGE"
      - name: Full backend suite including isolated recovery and collector acceptance
        env:
          # Name every test in the log, so the collector acceptance drivers show as run.
          PYTEST_ADDOPTS: -v
        run: pnpm backend:test ZONE_API_REHEARSAL=1
      - name: Forward account-deletion recovery migration
        run: sh docs/reviews/account-deletion-recovery-2026-10-17/reproduce-forward.sh -q
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node docs/plan/check-plan.mjs
      - run: node --test "scripts/*.test.mjs" "database/*.test.mjs"
